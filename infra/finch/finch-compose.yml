version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: dd-opensearch
    environment:
      - cluster.name=dd-cluster
      - node.name=dd-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: infra/finch/Dockerfile.api
    container_name: dd-api
    ports:
      - "8000:8000"
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - USE_OPENSEARCH=true
    depends_on:
      opensearch:
        condition: service_healthy

  web:
    build:
      context: ../../
      dockerfile: infra/finch/Dockerfile.web
    container_name: dd-web
    ports:
      - "3000:3000"
    depends_on:
      - api
